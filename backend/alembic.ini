# Alembic (plan B1, 2026-11-03). Run from the project root:
#   alembic -c backend/alembic.ini revision --autogenerate -m "opis"
# The app applies migrations itself at startup (backend/migrations_runner.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
